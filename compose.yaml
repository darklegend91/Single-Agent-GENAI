services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd_data:/etcd]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/minio_data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
  milvus:
    image: milvusdb/milvus:v2.6.3
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      COMMON_SECURITY_AUTHORIZATIONENABLED: 'true'
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD:?Set MILVUS_ROOT_PASSWORD}
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes: [milvus_data:/var/lib/milvus]
    ports: ['127.0.0.1:19530:19530']
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      KA_MILVUS_URI: http://milvus:19530
      KA_DATASET_PATH: /data/customer.csv
      KA_STAGING_DIR: /app/output/staging
      KA_ACTIVE_MANIFEST_PATH: /app/output/active.json
    depends_on:
      milvus: {condition: service_healthy}
    ports: ['127.0.0.1:8000:8000']
    volumes:
      - ${KA_DATASET_DIR:-./dataset}:/data:ro
      - app_output:/app/output
volumes:
  etcd_data:
  minio_data:
  milvus_data:
  app_output:
